<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu Perfil Hepático — Jueves en Wellkitt</title>

<style>
/* ============================================================================
   JUEVES EN WELLKITT — DETOX · deck para compartir pantalla (sala + Zoom)
   ----------------------------------------------------------------------------
   Mismo motor que el deck de peso (slides-jueves-peso.html):
   1. Lienzo fijo 1280x720, escalado al viewport. Sin reflujo.
   2. Contenido en SLIDES (datos), layout en plantillas.
   3. Presupuesto de caracteres por plantilla en LIMITES — si se rebasa, la
      slide se marca en rojo con el conteo, al escribir, no en vivo.
   4. window.__overflow mide scrollHeight vs clientHeight de cada slide.

   Paleta: los mismos tokens del video (DetoxScenes.tsx DETOX):
     jade  #2F7D63 — acento heroe (higado, bilis, botanica) = el --ambar de peso
     ocre  #B8791F — cifras y dato duro
     clay  #C23A22 — SOLO la advertencia de vesicula (= el --arcilla de peso)
     verde Wellkitt — SOLO productos, igual que en peso: donde termina la
     explicacion y empieza la venta.
   ========================================================================== */

:root {
  --perla:      #ECEEF0;
  --papel:      #F7F8F3;
  --tinta:      #1B1A18;
  --suave:      #6C6A66;
  --piedra:     #8C8983;
  --ambar:      #2F7D63;   /* jade — acento heroe, reemplaza el ambar de peso */
  --ocre:       #B8791F;   /* cifras y dato duro */
  --arcilla:    #C23A22;   /* SOLO la advertencia de vesicula */
  --verde:      #2E7D32;
  --verde-piel: #EDF4EE;
  --linea:      rgba(27, 26, 24, 0.14);
  --linea-suave:rgba(27, 26, 24, 0.07);

  --marco:      #D8DBDE;
  --marco-tinta:#4A4845;

  --sans: "Avenir Next", "Avenir", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root { --marco: #16181A; --marco-tinta: #8B8F94; }
}
:root[data-theme="dark"] { --marco: #16181A; --marco-tinta: #8B8F94; }
:root[data-theme="light"] { --marco: #D8DBDE; --marco-tinta: #4A4845; }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--marco);
  color: var(--marco-tinta);
  font-family: var(--sans);
  overflow: hidden;
  height: 100vh;
}

/* ---------- Escenario y escalado ---------- */

#escenario {
  position: fixed;
  inset: 0 0 44px 0;
  display: grid;
  place-items: center;
}

#lienzo {
  width: 1280px;
  height: 720px;
  flex: none;
  transform-origin: center center;
  position: relative;
  background:
    radial-gradient(130% 100% at 50% 0%, #FFFFFF 0%, var(--perla) 62%),
    linear-gradient(165deg, var(--papel) 0%, #E7EAEC 100%);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
  overflow: hidden;
}

/* Halo jade tenue detras del contenido, continuidad con el video. */
#lienzo::before {
  content: "";
  position: absolute;
  left: 50%; top: 46%;
  width: 900px; height: 560px;
  margin-left: -450px; margin-top: -280px;
  background: radial-gradient(closest-side, rgba(47, 125, 99, 0.13), transparent 72%);
  pointer-events: none;
}

.slide {
  position: absolute;
  inset: 0;
  padding: 74px 96px 0;
  display: none;
  flex-direction: column;
  color: var(--tinta);
}
.slide.activa { display: flex; }

.cuerpo {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}

/* ---------- Regla al pie ---------- */

.pie {
  flex: none;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--linea);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--piedra);
}
.pie-num { font-variant-numeric: tabular-nums; }

/* ---------- Tipografia compartida ---------- */

.eyebrow {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--piedra);
  margin-bottom: 26px;
}
.eyebrow::before {
  content: "";
  flex: none;
  width: 26px;
  height: 1px;
  background: currentColor;
  opacity: 0.65;
}
.eyebrow.ambar { color: var(--ambar); }

.titular {
  font-weight: 600;
  font-size: 62px;
  line-height: 1.06;
  letter-spacing: -0.022em;
  text-wrap: balance;
  margin: 0;
}
.subtitular {
  font-weight: 400;
  font-size: 27px;
  line-height: 1.45;
  color: var(--suave);
  margin: 26px 0 0;
  max-width: 900px;
}

.regla {
  width: 72px;
  height: 3px;
  background: var(--ambar);
  border-radius: 2px;
  margin: 34px 0 0;
}

/* ---------- Plantilla: portada ---------- */

.p-portada { align-items: flex-start; justify-content: center; }
.p-portada .marca {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--piedra);
  margin-bottom: 40px;
}
.p-portada .titulo {
  font-weight: 200;
  font-size: 104px;
  line-height: 0.98;
  letter-spacing: -0.035em;
  margin: 0;
}
.p-portada .titulo b { font-weight: 600; }
.p-portada .sub {
  font-size: 25px;
  color: var(--suave);
  margin: 30px 0 0;
  max-width: 780px;
  line-height: 1.4;
}
.p-portada .fecha {
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ambar);
  margin-top: 42px;
}

/* ---------- Plantilla: dato ---------- */

.p-dato { justify-content: center; }
.p-dato .fila-cifra { display: flex; align-items: baseline; gap: 18px; }
.p-dato .flecha {
  align-self: center;
  font-size: 58px;
  line-height: 1;
  color: var(--arcilla);
  transform: translateY(-10px);
}
.p-dato .cifra {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 178px;
  line-height: 0.86;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  color: var(--ocre);
  margin: 0;
}
.p-dato .unidad {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 25px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--tinta);
}
.p-dato .contexto {
  font-size: 25px;
  line-height: 1.45;
  color: var(--suave);
  margin: 16px 0 0;
  max-width: 820px;
}

/* La advertencia de vesicula: unica slide donde el dato duro va en clay,
   no en ocre, para que se lea como alto obligado, no como cifra neutra. */
.slide.clay .eyebrow.ambar { color: var(--arcilla); }
.slide.clay .regla { background: var(--arcilla); }
.slide.clay .p-dato .cifra { color: var(--arcilla); }
.slide.clay .titular { color: var(--arcilla); }

/* ---------- Plantilla: frase ---------- */

.p-frase { justify-content: center; }
.p-frase .tachado {
  display: inline-block;
  font-size: 30px;
  color: var(--piedra);
  text-decoration: line-through;
  text-decoration-color: var(--arcilla);
  text-decoration-thickness: 3px;
  margin-bottom: 26px;
}
.p-frase .grande {
  font-weight: 600;
  font-size: 78px;
  line-height: 1.04;
  letter-spacing: -0.03em;
  text-wrap: balance;
  margin: 0;
  max-width: 1010px;
}
.p-frase.enorme .grande { font-size: 104px; line-height: 1; }

/* ---------- Plantilla: lista ---------- */

.p-lista { justify-content: center; }
.p-lista .puntos {
  list-style: none;
  padding: 0;
  margin: 40px 0 0;
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-width: 1010px;
}
.p-lista .puntos li {
  position: relative;
  padding-left: 40px;
  font-size: 28px;
  line-height: 1.38;
  color: var(--tinta);
}
.p-lista .puntos li::before {
  content: "";
  position: absolute;
  left: 4px; top: 15px;
  width: 12px; height: 3px;
  background: var(--ambar);
  border-radius: 2px;
}
.p-lista .puntos li b { font-weight: 600; }
.p-lista .nota {
  margin: 38px 0 0;
  padding-top: 22px;
  border-top: 1px solid var(--linea-suave);
  font-size: 21px;
  line-height: 1.45;
  color: var(--suave);
  max-width: 940px;
}

/* La voz del grupo: frases que se dicen en coro. */
.p-lista .coro {
  margin: 36px 0 0;
  padding: 24px 30px;
  border-left: 4px solid var(--ambar);
  background: rgba(47, 125, 99, 0.07);
  font-size: 31px;
  font-weight: 500;
  line-height: 1.3;
  max-width: 940px;
}
.p-lista .coro span {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ambar);
  margin-bottom: 12px;
  font-weight: 400;
}

.slide.clay .p-lista .puntos li::before { background: var(--arcilla); }

/* ---------- Plantilla: escala 0-4 ---------- */

.p-escala { justify-content: center; }
.escala-fila {
  display: flex;
  gap: 18px;
  margin: 44px 0 0;
}
.escala-caja {
  flex: 1;
  border: 1px solid var(--linea);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.55);
  padding: 22px 18px;
  text-align: center;
}
.escala-caja .n {
  font-family: var(--mono);
  font-size: 40px;
  font-weight: 500;
  color: var(--ambar);
  line-height: 1;
}
.escala-caja .t {
  font-size: 19px;
  color: var(--suave);
  margin-top: 12px;
  line-height: 1.25;
}

/* ---------- Plantilla: perfil ---------- */

.p-perfil { justify-content: center; }
.perfil-cab { display: flex; align-items: baseline; gap: 26px; }
.perfil-letra {
  font-family: var(--mono);
  font-size: 112px;
  font-weight: 500;
  line-height: 0.82;
  color: var(--ambar);
  letter-spacing: -0.04em;
}
.perfil-nombre {
  font-weight: 600;
  font-size: 50px;
  line-height: 1.06;
  letter-spacing: -0.022em;
  max-width: 880px;
}
.perfil-sintoma {
  font-size: 25px;
  color: var(--suave);
  margin: 20px 0 0;
  padding-left: 138px;
}
.perfil-mec {
  margin: 34px 0 0;
  padding: 28px 32px;
  border-left: 4px solid var(--ambar);
  background: rgba(255, 255, 255, 0.6);
  font-size: 25px;
  line-height: 1.5;
  color: var(--tinta);
  max-width: 1010px;
}
.perfil-mec b { font-weight: 600; }

/* ---------- Plantilla: producto (verde Wellkitt) ---------- */

.slide.verde .eyebrow.ambar { color: var(--verde); }
.slide.verde .regla { background: var(--verde); }
.p-prod { justify-content: center; }
.p-prod .nombre {
  font-weight: 600;
  font-size: 62px;
  letter-spacing: -0.025em;
  line-height: 1;
  margin: 0;
}
.p-prod .cientifico.comun { font-style: normal; }
.p-prod .cientifico {
  font-style: italic;
  font-size: 25px;
  color: var(--suave);
  margin: 14px 0 0;
}
.p-prod .puntos {
  list-style: none;
  padding: 0;
  margin: 34px 0 0;
  display: flex;
  flex-direction: column;
  gap: 17px;
  max-width: 1010px;
}
.p-prod .puntos li {
  position: relative;
  padding-left: 34px;
  font-size: 25px;
  line-height: 1.4;
}
.p-prod .puntos li::before {
  content: "";
  position: absolute;
  left: 4px; top: 13px;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--verde);
}
.p-prod .noes {
  margin: 32px 0 0;
  padding: 20px 26px;
  border: 1px solid var(--linea);
  border-radius: 6px;
  background: var(--verde-piel);
  font-size: 23px;
  line-height: 1.4;
  max-width: 1010px;
}
.p-prod .noes span {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--verde);
  display: block;
  margin-bottom: 9px;
}

/* ---------- Plantilla de diagrama: barras comparadas ---------- */

.p-diag {
  display: grid;
  grid-template-columns: 1fr 480px;
  align-items: center;
  gap: 60px;
}
.p-diag .texto { min-width: 0; }
.p-diag .titular { font-size: 50px; }
.p-diag .nota {
  margin: 26px 0 0;
  font-size: 24px;
  line-height: 1.45;
  color: var(--suave);
}
.p-diag .nota b { color: var(--tinta); font-weight: 600; }
.p-diag .grafico { justify-self: center; }

.barras { display: flex; flex-direction: column; gap: 16px; }
.barra-fila {
  display: flex;
  align-items: flex-end;
  gap: 56px;
  height: 300px;
  border-bottom: 1px solid var(--linea);
}
.barra-etqs { display: flex; gap: 56px; }
.barra {
  width: 108px;
  border-radius: 6px 6px 0 0;
}
.barra.a { background: linear-gradient(180deg, #4C9A83, var(--ambar)); }
.barra.b { background: linear-gradient(180deg, #A9A6A1, #7E7B76); }
.barra-etq {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--suave);
  text-align: center;
  width: 108px;
  line-height: 1.5;
}

/* ---------- Plantilla: cronometro ---------- */

.p-crono { justify-content: center; align-items: flex-start; }
.p-crono .grande {
  font-weight: 600;
  font-size: 78px;
  line-height: 1.04;
  letter-spacing: -0.03em;
  margin: 0;
}
.crono-barra {
  margin-top: 52px;
  width: 1010px;
  height: 8px;
  background: var(--linea-suave);
  border-radius: 4px;
  overflow: hidden;
}
.crono-relleno {
  height: 100%;
  width: 100%;
  background: var(--ambar);
  border-radius: 4px;
  transform-origin: left center;
}
.crono-num {
  font-family: var(--mono);
  font-size: 68px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ambar);
  margin-top: 26px;
  line-height: 1;
}
.crono-nota {
  font-size: 21px;
  color: var(--suave);
  margin-top: 22px;
  max-width: 900px;
  line-height: 1.45;
}

/* ---------- Plantilla: ruta ---------- */

.p-ruta { justify-content: center; }
.ruta-tabla { margin-top: 42px; display: flex; flex-direction: column; gap: 0; }
.ruta-fila {
  display: grid;
  grid-template-columns: 78px 1fr 340px;
  align-items: center;
  gap: 24px;
  padding: 26px 0;
  border-top: 1px solid var(--linea);
}
.ruta-fila:last-child { border-bottom: 1px solid var(--linea); }
.ruta-letra {
  font-family: var(--mono);
  font-size: 46px;
  font-weight: 500;

}
.ruta-nombre { font-size: 27px; font-weight: 500; letter-spacing: -0.015em; }
.ruta-prod {
  font-size: 27px;
  font-weight: 600;

  text-align: right;
}

/* ---------- Plantilla: cierre ---------- */

.p-cierre { justify-content: center; }
.p-cierre .palabra {
  font-family: var(--mono);
  font-size: 96px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--ambar);
  line-height: 1;
  margin: 30px 0 0;
}
.p-cierre .lineas {
  list-style: none;
  padding: 0;
  margin: 38px 0 0;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.p-cierre .lineas li { font-size: 27px; line-height: 1.4; color: var(--tinta); }
.p-cierre .lineas li b { font-weight: 600; }


/* ============================================================================
   MOVIMIENTO — igual regla que en peso: el estado natural es VISIBLE.
   ========================================================================== */

@keyframes entra {
  from { opacity: 0; transform: translateY(20px); }
}
@keyframes entraCorto {
  from { opacity: 0; transform: translateY(12px); }
}
@keyframes tacha {
  from { transform: scaleX(0); }
}
@keyframes crece {
  from { transform: scaleY(0); }
}

.slide.animar .cuerpo > * { animation: entra 0.52s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
.slide.animar .cuerpo > *:nth-child(2) { animation-delay: 0.10s; }
.slide.animar .cuerpo > *:nth-child(3) { animation-delay: 0.19s; }
.slide.animar .cuerpo > *:nth-child(4) { animation-delay: 0.27s; }
.slide.animar .cuerpo > *:nth-child(5) { animation-delay: 0.34s; }
.slide.animar .cuerpo > *:nth-child(6) { animation-delay: 0.40s; }

.slide.animar .puntos li,
.slide.animar .lineas li,
.slide.animar .ruta-fila,
.slide.animar .escala-caja {
  animation: entraCorto 0.42s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}
.slide.animar .puntos li:nth-child(1),
.slide.animar .lineas li:nth-child(1),
.slide.animar .ruta-fila:nth-child(1),
.slide.animar .escala-caja:nth-child(1) { animation-delay: 0.30s; }
.slide.animar .puntos li:nth-child(2),
.slide.animar .lineas li:nth-child(2),
.slide.animar .ruta-fila:nth-child(2),
.slide.animar .escala-caja:nth-child(2) { animation-delay: 0.40s; }
.slide.animar .puntos li:nth-child(3),
.slide.animar .lineas li:nth-child(3),
.slide.animar .ruta-fila:nth-child(3),
.slide.animar .escala-caja:nth-child(3) { animation-delay: 0.50s; }
.slide.animar .puntos li:nth-child(4),
.slide.animar .escala-caja:nth-child(4) { animation-delay: 0.60s; }
.slide.animar .puntos li:nth-child(5),
.slide.animar .escala-caja:nth-child(5) { animation-delay: 0.70s; }
.slide.animar .puntos li:nth-child(6) { animation-delay: 0.80s; }

.p-frase .tachado {
  position: relative;
  text-decoration: none;
  align-self: flex-start;
}
.p-frase .tachado::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  top: 52%;
  height: 3px;
  background: var(--arcilla);
  transform-origin: left center;
}
.slide.animar .p-frase .tachado::after {
  animation: tacha 0.46s cubic-bezier(0.5, 0, 0.2, 1) both;
  animation-delay: 0.55s;
}

.barra { transform-origin: bottom center; }
.slide.animar .barra { animation: crece 0.75s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
.slide.animar .barra.a { animation-delay: 0.30s; }
.slide.animar .barra.b { animation-delay: 0.42s; }

@media (prefers-reduced-motion: reduce) {
  .slide.animar .cuerpo > *,
  .slide.animar .puntos li,
  .slide.animar .lineas li,
  .slide.animar .ruta-fila,
  .slide.animar .escala-caja,
  .slide.animar .barra,
  .slide.animar .p-frase .tachado::after { animation: none !important; }
}

/* ---------- Aviso de presupuesto excedido ---------- */

.alerta {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: var(--arcilla);
  color: #fff;
  font-family: var(--mono);
  font-size: 13px;

  letter-spacing: 0.04em;

/* ---------- Barra de control ---------- */

#control {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--marco-tinta);
  opacity: 0.5;
  transition: opacity 0.2s;
  pointer-events: none;
}
#control:hover { opacity: 1; }
#control b { font-weight: 500; color: inherit; }
</style>

<div id="escenario"><div id="lienzo"></div></div>
<div id="control">
  <span>← → cambiar</span>
  <span><b id="ctl-num">1</b> / <b id="ctl-tot">1</b></span>
  <span>espacio: cronómetro</span>
</div>

<script>
/* ===========================================================================
   1. PRESUPUESTO POR PLANTILLA
   ========================================================================= */
const LIMITES = {
  portada:  { titulo: 40, sub: 120, fecha: 46 },
  dato:     { cifra: 7, unidad: 26, contexto: 130 },
  frase:    { tachado: 34, grande: 92, sub: 130 },
  fraseXL:  { grande: 46 },

const limpio = (s) => String(s || "").replace(/<[^>]*>/g, "").replace(/\|/g, " ");

function revisar(s) {
  const L = LIMITES[s.t];
  if (!L) return [];
  const fallas = [];
  const mide = (campo, valor, max) => {
    const n = limpio(valor).length;
    if (n > max) fallas.push(`${campo}: ${n}/${max}`);
  };
  if (s.titulo   !== undefined && L.titulo)   mide("título", s.titulo, L.titulo);
  if (s.etiquetaA!== undefined && L.etiquetaA)mide("etiqueta A", s.etiquetaA, L.etiquetaA);
  if (s.etiquetaB!== undefined && L.etiquetaB)mide("etiqueta B", s.etiquetaB, L.etiquetaB);
  if (s.sub      !== undefined && L.sub)      mide("sub", s.sub, L.sub);
  if (s.fecha    !== undefined && L.fecha)    mide("fecha", s.fecha, L.fecha);
  if (s.cifra    !== undefined && L.cifra)    mide("cifra", s.cifra, L.cifra);
  if (s.unidad   !== undefined && L.unidad)   mide("unidad", s.unidad, L.unidad);
  if (s.contexto !== undefined && L.contexto) mide("contexto", s.contexto, L.contexto);
  if (s.tachado  !== undefined && L.tachado)  mide("tachado", s.tachado, L.tachado);
  if (s.grande   !== undefined && L.grande)   mide("grande", s.grande, L.grande);
  if (s.nota     !== undefined && L.nota)     mide("nota", s.nota, L.nota);
  if (s.coro     !== undefined && L.coro)     mide("coro", s.coro, L.coro);
  if (s.nombre   !== undefined && L.nombre)   mide("nombre", s.nombre, L.nombre);
  if (s.sintoma  !== undefined && L.sintoma)  mide("síntoma", s.sintoma, L.sintoma);
  if (s.mecanismo!== undefined && L.mecanismo)mide("mecanismo", s.mecanismo, L.mecanismo);
  if (s.cientifico!==undefined && L.cientifico)mide("científico", s.cientifico, L.cientifico);
  if (s.noes     !== undefined && L.noes)     mide("lo-que-no-es", s.noes, L.noes);
  if (Array.isArray(s.puntos)) {
    if (L._maxPuntos && s.puntos.length > L._maxPuntos)
      fallas.push(`puntos: ${s.puntos.length}/${L._maxPuntos}`);
    s.puntos.forEach((p, i) => mide(`punto ${i + 1}`, p, L.punto));
  }
  if (Array.isArray(s.lineas)) s.lineas.forEach((p, i) => mide(`línea ${i + 1}`, p, L.linea));
  if (Array.isArray(s.filas)) s.filas.forEach((f, i) => {
    mide(`fila ${i + 1} nombre`, f.nombre, L.nombre);
    mide(`fila ${i + 1} producto`, f.producto, L.producto);
  });
  return fallas;
}

/* ---- Navegacion ---- */
let actual = 0;
let cronoID = null;

const quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function contarCifras(slide) {
  slide.querySelectorAll(".cifra").forEach((el) => {
    const texto = el.dataset.valor || el.textContent;
    el.dataset.valor = texto;
    const m = texto.match(/^(\D*)([\d.]+)(\D*)$/);
    if (!m) return;
    const [, pre, num, post] = m;
    const destino = parseFloat(num);
    const dec = (num.split(".")[1] || "").length;
    const dur = 950;
    const t0 = performance.now();
    (function paso(t) {
      const k = Math.min(1, (t - t0) / dur);
      const suave = 1 - Math.pow(1 - k, 3);
      el.textContent = pre + (destino * suave).toFixed(dec) + post;
      if (k < 1) requestAnimationFrame(paso);
      else el.textContent = texto;
    })(t0);
  });
}

function mostrar(n) {
  actual = Math.max(0, Math.min(total - 1, n));
  document.querySelectorAll(".slide").forEach((el, i) => {
    el.classList.toggle("activa", i === actual);
    el.classList.remove("animar");
  });
  const viva = document.querySelectorAll(".slide")[actual];
  if (!quieto) {
    void viva.offsetWidth;
    viva.classList.add("animar");
    contarCifras(viva);
  }
  document.getElementById("ctl-num").textContent = actual + 1;
  if (cronoID) { clearInterval(cronoID); cronoID = null; }
  location.hash = actual + 1;
}

/* ---- Cronometro: dispara con espacio, se puede reiniciar ---- */
function correrCrono() {
  const c = document.querySelector(".slide.activa .p-crono");
  if (!c) return;
  const seg = Number(c.dataset.segundos);
  const num = c.querySelector(".crono-num");
  const rel = c.querySelector(".crono-relleno");
  if (cronoID) clearInterval(cronoID);
  let restante = seg;
  num.textContent = restante;
  rel.style.transition = "none";
  rel.style.transform = "scaleX(1)";
  requestAnimationFrame(() => {
    rel.style.transition = `transform ${seg}s linear`;
    rel.style.transform = "scaleX(0)";
  });
  cronoID = setInterval(() => {
    restante -= 1;
    num.textContent = Math.max(0, restante);
    if (restante <= 0) { clearInterval(cronoID); cronoID = null; }
  }, 1000);
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); mostrar(actual + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); mostrar(actual - 1); }
  else if (e.key === "Home") { e.preventDefault(); mostrar(0); }
  else if (e.key === "End") { e.preventDefault(); mostrar(total - 1); }
  else if (e.key === " ") { e.preventDefault(); correrCrono(); }
});
document.addEventListener("click", (e) => {
  if (e.target.closest("#control")) return;
  mostrar(actual + (e.clientX < window.innerWidth * 0.28 ? -1 : 1));
});

mostrar(Number(location.hash.slice(1)) - 1 || 0);

    el.classList.remove("animar");
    const c = el.querySelector(".cuerpo");
    if (c && c.scrollHeight > c.clientHeight + 1) {
      fuera.push({ slide: i + 1, tipo: SLIDES[i].t, sobra: c.scrollHeight - c.clientHeight });
    }
    if (!previo) el.classList.remove("activa");
  });
  window.__overflow = fuera;
  return fuera;
};
window.__medirOverflow();
if (window.__errores.length) console.warn("Presupuesto excedido:", window.__errores);
if (window.__overflow.length) console.warn("Desbordamiento medido:", window.__overflow);
</script>
